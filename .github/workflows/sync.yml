name: Sync Lichess Data

on:
  # Run automatically every 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  # Also run on every push to main
  push:
    branches: [main]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated JSON files back

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install Python dependencies
        run: pip install requests

      # 4. Run data fetch script
      - name: Fetch Lichess data
        env:
          LICHESS_USERNAME: ${{ vars.LICHESS_USERNAME }}  # set in repo Settings > Variables
        run: |
          python scripts/fetch_data.py --username "$LICHESS_USERNAME"

      # 5. Commit updated JSON files if anything changed
      - name: Commit updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action (Lichess Sync)"
          git add data/profile.json data/games.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-sync Lichess data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
